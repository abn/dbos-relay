name: test-suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (PostgreSQL & SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start PostgreSQL with Podman
        run: |
          podman run -d \
            --name test-postgres \
            -p 5433:5432 \
            -e POSTGRES_USER=relay \
            -e POSTGRES_DB=relay \
            -e POSTGRES_PASSWORD=relay \
            docker.io/library/postgres:16-alpine
          timeout 30s bash -c 'until podman exec test-postgres pg_isready -U relay -d relay; do sleep 1; done'

      - name: Run test suite
        env:
          RELAY_TEST_DATABASE_URL: postgres://relay:relay@localhost:5433/relay?sslmode=disable
        run: make test

      - name: Build binary
        run: make build

      - name: Verify embedded standalone mode
        run: |
          ./bin/relay serve --embedded &
          RELAY_PID=$!
          timeout 15s bash -c 'until curl -sf http://localhost:8090/healthz; do sleep 1; done'
          kill $RELAY_PID || true

      - name: Stop PostgreSQL
        if: always()
        run: |
          podman rm -f test-postgres || true

  cross-compile:
    name: Cross Compile (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/relay

  container-build:
    name: Container Build (Buildah)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image with Buildah
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: relay
          tags: test
          containerfiles: |
            ./Containerfile
          build-args: |
            VERSION=test

      - name: Verify container execution with Podman
        run: |
          podman run --rm ${{ steps.build-image.outputs.image }}:test version
