name: conformance

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  embedded-conformance:
    name: Embedded SQLite Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Embedded Store Conformance Tests
        run: |
          go test -v -count=1 ./internal/store/...
          go test -v -count=1 -run TestEmbeddedSuite_EndToEnd ./tests/conformance/...

      - name: Verify Embedded Standalone Server Lifecycle
        run: |
          make build
          ./bin/relay serve --embedded &
          RELAY_PID=$!
          timeout 15s bash -c 'until curl -sf http://localhost:8090/healthz; do sleep 1; done'
          kill $RELAY_PID || true

  postgres-conformance:
    name: PostgreSQL Live Conformance & Chaos
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Start PostgreSQL with Podman
        run: |
          podman run -d \
            --name conf-postgres \
            -p 5433:5432 \
            -e POSTGRES_USER=relay \
            -e POSTGRES_DB=relay \
            -e POSTGRES_PASSWORD=relay \
            docker.io/library/postgres:16-alpine
          timeout 30s bash -c 'until podman exec conf-postgres pg_isready -U relay -d relay; do sleep 1; done'

      - name: Run Live Database Conformance Suite
        env:
          RELAY_TEST_DATABASE_URL: postgres://relay:relay@localhost:5433/relay?sslmode=disable
        run: |
          make verify-live

      - name: Stop PostgreSQL
        if: always()
        run: |
          podman rm -f conf-postgres || true

  sdk-conformance:
    name: Multi-SDK Real Stack Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Start Podman API Service
        run: |
          SOCK_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman"
          mkdir -p "$SOCK_DIR"
          SOCK="$SOCK_DIR/podman.sock"
          if [ ! -S "$SOCK" ]; then
            podman system service --time=0 "unix://$SOCK" &
            timeout 15s bash -c "until [ -S \"$SOCK\" ]; do sleep 0.2; done"
          fi
          echo "DOCKER_HOST=unix://$SOCK" >> $GITHUB_ENV

      - name: Run Multi-SDK Conformance Suite
        run: |
          make verify-sdk

      - name: Tear Down SDK Apps Stack
        if: always()
        run: |
          podman compose --env-file deploy/.env -f deploy/compose-sdk-apps.yaml down -v || true
