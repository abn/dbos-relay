groups:
  - name: relay-alerts
    rules:
      - alert: RelayNoExecutors
        expr: sum(dbos_conductor_v1_executor_count{status="HEALTHY"}) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No healthy executors connected"
          description: "Relay has 0 healthy connected executors for more than 1 minute."

      - alert: RelayExecutorsDisconnected
        expr: sum(dbos_conductor_v1_executor_count{status="DISCONNECTED"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disconnected executors detected"
          description: "Relay has detected executors in disconnected status for more than 5 minutes."
