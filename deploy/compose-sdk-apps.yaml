services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_DB: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 2s
      retries: 10

  relay:
    image: alpine:latest
    security_opt:
      - "seccomp=unconfined"
    command: ["/bin/relay", "serve"]
    environment:
      RELAY_CONFIG: /etc/relay/relay.yaml
      RELAY_DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable
      RELAY_LISTEN_ADDR: 0.0.0.0:8090
      RELAY_INTERNAL_SECRET: insecure-test-secret
    volumes:
      - ../bin/relay:/bin/relay:ro,z
      - ./relay.yaml:/etc/relay/relay.yaml:ro,z
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  app-golang-victim:
    image: alpine:latest
    security_opt:
      - "seccomp=unconfined"
    working_dir: /app
    volumes:
      - ../examples/golang:/app:ro,z
    environment:
      RELAY_URL: ws://relay:8090
      RELAY_API_KEY: dbos_sec_live_key
      DBOS_APP_NAME: golang-sample-app
      DBOS_SYSTEM_DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable
      ROLE: victim
    depends_on:
      relay:
        condition: service_started
      postgres:
        condition: service_healthy
    command: ["/app/bin/app"]
    restart: "no"

  app-golang-survivor:
    image: alpine:latest
    security_opt:
      - "seccomp=unconfined"
    working_dir: /app
    volumes:
      - ../examples/golang:/app:ro,z
    environment:
      RELAY_URL: ws://relay:8090
      RELAY_API_KEY: dbos_sec_live_key
      DBOS_APP_NAME: golang-sample-app
      DBOS_SYSTEM_DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable
      ROLE: survivor
    depends_on:
      relay:
        condition: service_started
      postgres:
        condition: service_healthy
    command: ["/app/bin/app"]
    restart: "no"

  app-python:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../examples/python:/app:ro,z
    environment:
      RELAY_URL: ws://relay:8090
      RELAY_API_KEY: dbos_sec_live_key
      DBOS_APP_NAME: python-sample-app
      DBOS_SYSTEM_DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable
    depends_on:
      relay:
        condition: service_started
      postgres:
        condition: service_healthy
    command: ["python", "/app/main.py"]
    restart: "no"

  app-typescript:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ../examples/typescript:/app:ro,z
    environment:
      RELAY_URL: ws://relay:8090
      RELAY_API_KEY: dbos_sec_live_key
      DBOS_APP_NAME: typescript-sample-app
      DBOS_SYSTEM_DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable
    depends_on:
      relay:
        condition: service_started
      postgres:
        condition: service_healthy
    command: ["node", "--experimental-websocket", "/app/src/index.js"]
    restart: "no"

  app-java:
    image: eclipse-temurin:17-jre-alpine
    working_dir: /app
    volumes:
      - ../examples/java:/app:ro,z
    environment:
      RELAY_URL: ws://relay:8090
      RELAY_API_KEY: dbos_sec_live_key
      DBOS_APP_NAME: java-sample-app
      DBOS_SYSTEM_DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable
    depends_on:
      relay:
        condition: service_started
      postgres:
        condition: service_healthy
    command: ["java", "-cp", "/app/bin", "com.example.App"]
    restart: "no"
