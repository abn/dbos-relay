services:
  postgres:
    image: postgres:17-alpine
    command:
      - "postgres"
      - "-c"
      - "max_connections=120"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "tcp_keepalives_idle=10"
      - "-c"
      - "tcp_keepalives_interval=2"
      - "-c"
      - "tcp_keepalives_count=3"
    environment:
      POSTGRES_USER: relay
      POSTGRES_DB: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "5433:5432"
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 2s
      retries: 10

  relay:
    image: alpine:latest
    security_opt:
      - "seccomp=unconfined"
    command: ["/bin/relay", "serve"]
    environment:
      RELAY_CONFIG: /etc/relay/relay.yaml
      RELAY_DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable
      RELAY_LISTEN_ADDR: 0.0.0.0:8090
      RELAY_INTERNAL_SECRET: insecure-test-secret
      RELAY_API_KEY: ${RELAY_API_KEY}
    volumes:
      - ../bin/relay:/bin/relay:ro,z
      - ./relay.yaml:/etc/relay/relay.yaml:ro,z
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/healthz || exit 1"]
      interval: 1s
      timeout: 2s
      retries: 15

  app-golang-primary:
    image: alpine:latest
    security_opt:
      - "seccomp=unconfined"
    working_dir: /app
    volumes:
      - ../examples/golang:/app:ro,z
    environment:
      RELAY_URL: ws://relay:8090
      RELAY_API_KEY: ${RELAY_API_KEY}
      DBOS_APP_NAME: golang-sample-app
      DBOS_SYSTEM_DATABASE_URL: postgres://relay:relay@postgres:5432/relay_golang?sslmode=disable&pool_max_conns=2
      ROLE: primary
      HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      relay:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["/app/bin/app"]
    restart: "no"

  app-golang-secondary:
    image: alpine:latest
    security_opt:
      - "seccomp=unconfined"
    working_dir: /app
    volumes:
      - ../examples/golang:/app:ro,z
    environment:
      RELAY_URL: ws://relay:8090
      RELAY_API_KEY: ${RELAY_API_KEY}
      DBOS_APP_NAME: golang-sample-app
      DBOS_SYSTEM_DATABASE_URL: postgres://relay:relay@postgres:5432/relay_golang?sslmode=disable&pool_max_conns=2
      ROLE: secondary
      HTTP_PORT: 8086
    ports:
      - "8086:8086"
    depends_on:
      relay:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["/app/bin/app"]
    restart: "no"

  app-python-primary:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ../examples/python:/app:z
      - uv-cache:/root/.cache/uv
    environment:
      RELAY_URL: ws://relay:8090
      RELAY_API_KEY: ${RELAY_API_KEY}
      DBOS_APP_NAME: python-sample-app
      DBOS_SYSTEM_DATABASE_URL: postgres://relay:relay@postgres:5432/relay_python?sslmode=disable
      ROLE: primary
      CHAOS_SLEEP_SECS: "1800"
      HTTP_PORT: 8081
      UV_CACHE_DIR: /root/.cache/uv
    ports:
      - "8081:8081"
    depends_on:
      relay:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "pip install -q uv && uv run main.py"]
    restart: "no"

  app-python-secondary:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ../examples/python:/app:z
      - uv-cache:/root/.cache/uv
    environment:
      RELAY_URL: ws://relay:8090
      RELAY_API_KEY: ${RELAY_API_KEY}
      DBOS_APP_NAME: python-sample-app
      DBOS_SYSTEM_DATABASE_URL: postgres://relay:relay@postgres:5432/relay_python?sslmode=disable
      ROLE: secondary
      HTTP_PORT: 8084
      UV_CACHE_DIR: /root/.cache/uv
    ports:
      - "8084:8084"
    depends_on:
      relay:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "pip install -q uv && uv run main.py"]
    restart: "no"

  app-typescript-primary:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ../examples/typescript:/app:ro,z
    environment:
      RELAY_URL: ws://relay:8090
      RELAY_API_KEY: ${RELAY_API_KEY}
      DBOS_APP_NAME: typescript-sample-app
      DBOS_SYSTEM_DATABASE_URL: postgres://relay:relay@postgres:5432/relay_typescript?sslmode=disable
      ROLE: primary
      HTTP_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      relay:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["node", "/app/dist/index.js"]
    restart: "no"

  app-typescript-secondary:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ../examples/typescript:/app:ro,z
    environment:
      RELAY_URL: ws://relay:8090
      RELAY_API_KEY: ${RELAY_API_KEY}
      DBOS_APP_NAME: typescript-sample-app
      DBOS_SYSTEM_DATABASE_URL: postgres://relay:relay@postgres:5432/relay_typescript?sslmode=disable
      ROLE: secondary
      HTTP_PORT: 8085
    ports:
      - "8085:8085"
    depends_on:
      relay:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["node", "/app/dist/index.js"]
    restart: "no"

  app-java:
    image: eclipse-temurin:21-jre-alpine
    working_dir: /app
    volumes:
      - ../examples/java:/app:ro,z
    environment:
      RELAY_URL: ws://relay:8090
      RELAY_API_KEY: ${RELAY_API_KEY}
      DBOS_APP_NAME: java-sample-app
      DBOS_SYSTEM_DATABASE_URL: postgres://relay:relay@postgres:5432/relay_java?sslmode=disable
      ROLE: primary
      HTTP_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      relay:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["java", "-jar", "/app/target/dbos-java-sample-1.0.0.jar"]
    restart: "no"

  app-java-secondary:
    image: eclipse-temurin:21-jre-alpine
    working_dir: /app
    volumes:
      - ../examples/java:/app:ro,z
    environment:
      RELAY_URL: ws://relay:8090
      RELAY_API_KEY: ${RELAY_API_KEY}
      DBOS_APP_NAME: java-sample-app
      DBOS_SYSTEM_DATABASE_URL: postgres://relay:relay@postgres:5432/relay_java?sslmode=disable
      ROLE: secondary
      HTTP_PORT: 8087
    ports:
      - "8087:8087"
    depends_on:
      relay:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["java", "-jar", "/app/target/dbos-java-sample-1.0.0.jar"]
    restart: "no"

volumes:
  uv-cache:
